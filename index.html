<script>(() => {
'use strict';
const $=s=>document.querySelector(s), machine=$('.machine'),lever=$('#lever'),speak=$('#speak'),sound=$('#sound');
const saved=(()=>{try{return JSON.parse(localStorage.getItem('phonics-prefs-v2'))||{};}catch{return {};}})();
let state={level:[3,4,5].includes(+saved.level)?+saved.level:3,category:['basic','vowel','consonant'].includes(saved.category)?saved.category:'basic',filter:saved.filter||'all'};
if(!Phonics.pool(state).length)state.filter='all';
let muted=saved.muted===true,busy=false,current=null,audio,pointer=null,suppressClickUntil=0;
let reels=[],voiceId=0,speaking=false,loading=false;
const player=$('#word-audio'),bag=new Phonics.WordBag(),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const prompt=text=>{$('#prompt').textContent=text;};
const save=()=>{try{localStorage.setItem('phonics-prefs-v2',JSON.stringify({...state,muted}));}catch{}};
const vowel=u=>/^[aeiou]/.test(u);
function buildReels(entry){
 const bed=$('.reel-bed'),labels=$('.reel-labels');bed.replaceChildren();labels.replaceChildren();
 bed.style.setProperty('--cols',entry.units.length);labels.style.setProperty('--cols',entry.units.length);machine.dataset.columns=entry.units.length;
 entry.units.forEach(u=>{const r=document.createElement('div');r.className='reel'+(vowel(u)?' vowel':'')+(u.length>1?' digraph':'');const s=document.createElement('div');s.className='strip';s.append(Object.assign(document.createElement('span'),{textContent:u}));r.append(s);bed.append(r);const l=document.createElement('span');l.className=vowel(u)?'vowel-label':'';l.textContent=(vowel(u)?'元音':'辅音')+(u.length>1?'组合':'');labels.append(l);});reels=[...bed.children];
}
function paintWord(entry){current=entry;buildReels(entry);$('#word-live').textContent=entry.word;$('#unit-hint').textContent=entry.length+' 个字母 · '+entry.units.length+' 个拼读格';speak.setAttribute('aria-label','朗读单词 '+entry.word);prepareAudio(entry).catch(()=>{});}
function paintControls(){
 document.querySelectorAll('[data-level]').forEach(b=>{b.setAttribute('aria-pressed',String(+b.dataset.level===state.level));b.disabled=busy;});
 document.querySelectorAll('[data-category]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.category===state.category));b.disabled=busy;});
 const select=$('#focus-filter');select.replaceChildren();for(const value of ['all',...Phonics.options(state)]){const o=document.createElement('option');o.value=value;o.textContent=value==='all'?'全部':state.category==='basic'?'短元音 '+value:Phonics.labels[value];select.append(o);}select.value=state.filter;select.disabled=busy;
 $('#word-count').textContent=Phonics.pool(state).length+' 个词';
 sound.setAttribute('aria-pressed',String(!muted));sound.setAttribute('aria-label',muted?'开启滚动音效':'关闭滚动音效');sound.querySelector('use').setAttribute('href',muted?'#i-mute':'#i-speaker');sound.querySelector('span').textContent=muted?'音效关':'音效开';lever.setAttribute('aria-disabled',String(busy));speak.disabled=busy;$('#machine-state').textContent=busy?'发现新单词':'准备就绪';
}
  function initAudio() {
    if (muted) return;
    try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; audio ||= new AC(); if (audio.state === 'suspended') audio.resume().catch(() => {}); } catch {}
  }
  function tone(frequency, duration = .045, volume = .018) {
    if (muted || !audio || audio.state !== 'running') return;
    try { const osc = audio.createOscillator(), gain = audio.createGain(), now = audio.currentTime;
      osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, now); osc.frequency.exponentialRampToValueAtTime(frequency*.75, now+duration);
      gain.gain.setValueAtTime(volume, now); gain.gain.exponentialRampToValueAtTime(.001, now+duration);
      osc.connect(gain); gain.connect(audio.destination); osc.start(now); osc.stop(now+duration);
      osc.onended = () => { osc.disconnect(); gain.disconnect(); };
    } catch {}
  }

const pending=new Map();window.PHONICS_AUDIO ||= {};
function loadAudio(word){
 if(window.PHONICS_AUDIO[word])return Promise.resolve(window.PHONICS_AUDIO[word]);
 const pack=window.AUDIO_MANIFEST?.[word];if(!pack)return Promise.reject(new Error('missing'));
 if(!pending.has(pack))pending.set(pack,new Promise((resolve,reject)=>{const script=document.createElement('script');let timer;const clean=()=>{clearTimeout(timer);script.remove();};script.src=pack;script.onload=()=>{clean();resolve();};script.onerror=()=>{clean();pending.delete(pack);reject(new Error('load'));};timer=setTimeout(()=>{clean();pending.delete(pack);reject(new Error('timeout'));},15000);document.head.append(script);}));
 return pending.get(pack).then(()=>{if(!window.PHONICS_AUDIO[word]){pending.delete(pack);throw new Error('missing');}return window.PHONICS_AUDIO[word];});
}
async function prepareAudio(entry){const src=await loadAudio(entry.word);if(current===entry&&!speaking&&!loading){player.src=src;player.preload='auto';player.load();}return src;}
function stopSpeech(){voiceId++;speaking=false;loading=false;player.pause();try{player.currentTime=0;}catch{}speak.classList.remove('speaking');speak.querySelector('span').textContent='听一听';speak.setAttribute('aria-pressed','false');}
function returnLever(){lever.classList.add('returning');lever.style.setProperty('--pull','0px');}
async function spin(){
 if(busy)return;busy=true;stopSpeech();initAudio();paintControls();machine.classList.remove('settled');machine.classList.add('is-spinning');prompt('字母转呀转，新单词马上来…');lever.classList.add('returning');lever.style.setProperty('--pull','78px');setTimeout(returnLever,140);
 const target=bag.next(state,current?.word);buildReels(target);const timer=setInterval(()=>tone(280+Math.random()*180),115);
 try{await Promise.all(reels.map(async(reel,i)=>{const strip=reel.firstElementChild,u=target.units[i],pool=vowel(u)?['a','e','i','o','u','ai','ee']:['b','c','d','f','g','h','m','n','p','s','t','sh','ch'];
 if(reduced.matches||!strip.animate)await new Promise(r=>setTimeout(r,180+i*90));
 else{const length=19+i*3,nodes=[];for(let j=0;j<=length;j++)nodes.push(Object.assign(document.createElement('span'),{textContent:j===length?u:pool[Math.floor(Math.random()*pool.length)]}));strip.replaceChildren(...nodes);const animation=strip.animate([{transform:'translateY(0)'},{transform:'translateY(-'+100*length/(length+1)+'%)'}],{duration:1250+i*180,easing:'cubic-bezier(.15,.6,.16,1)',fill:'forwards'});try{await animation.finished;}catch{}finally{animation.cancel();}}
 strip.replaceChildren(Object.assign(document.createElement('span'),{textContent:u}));tone(510+i*100,.08,.035);
 }));paintWord(target);machine.classList.add('settled');prompt('把各格的声音连起来，试着读一读！');}
 finally{clearInterval(timer);busy=false;machine.classList.remove('is-spinning');paintControls();returnLever();}
}
  lever.addEventListener('pointerdown', e => {
    if (busy || !e.isPrimary || (e.pointerType==='mouse' && e.button!==0)) return;
    pointer = {id:e.pointerId,x:e.clientX,y:e.clientY,delta:0,moved:0};
    lever.classList.remove('returning'); lever.setPointerCapture(e.pointerId);
  });
  lever.addEventListener('pointermove', e => {
    if (!pointer || pointer.id!==e.pointerId) return;
    pointer.delta = Math.max(0,Math.min(85,e.clientY-pointer.y));
    pointer.moved = Math.max(pointer.moved,Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y));
    lever.style.setProperty('--pull',pointer.delta+'px');
  });
  lever.addEventListener('pointerup', e => {
    if (!pointer || pointer.id!==e.pointerId) return;
    const p = pointer; pointer=null; suppressClickUntil=performance.now()+500; returnLever();
    if (lever.hasPointerCapture(e.pointerId)) lever.releasePointerCapture(e.pointerId);
    if (p.delta>=28 || p.moved<9) spin();
  });
  const cancelDrag = () => { if (pointer) {pointer=null;suppressClickUntil=performance.now()+500;returnLever();} };
  lever.addEventListener('pointercancel',cancelDrag); lever.addEventListener('lostpointercapture',cancelDrag);
  window.addEventListener('blur',cancelDrag);
  lever.addEventListener('click',e => { if (e.detail===0 || performance.now()>suppressClickUntil) spin(); });
  document.addEventListener('keydown', e => {
    if (e.code!=='Space' || e.repeat || e.altKey || e.ctrlKey || e.metaKey || e.target.closest('button,a,input,textarea,select,[contenteditable=true]')) return;
    e.preventDefault(); spin();
  });

function change(next){if(busy)return;stopSpeech();state={...state,...next};if(!Phonics.pool(state).length)state.filter='all';save();paintControls();paintWord(bag.next(state,current?.word));prompt('先自己拼读，再点喇叭听一听。');}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{if(+b.dataset.level!==state.level)change({level:+b.dataset.level});}));
document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.category!==state.category)change({category:b.dataset.category,filter:'all'});}));
$('#focus-filter').addEventListener('change',e=>change({filter:e.target.value}));
  sound.addEventListener('click',() => { muted=!muted;save();paintControls();if(!muted){initAudio();tone(600,.06);} });
  $('#fullscreen').addEventListener('click',async () => {
    try {
      if(document.fullscreenElement) await document.exitFullscreen();
      else if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      else prompt('当前浏览器不支持全屏，可横屏使用。');
    } catch { prompt('暂时无法进入全屏，可用浏览器全屏功能。'); }
  });
  document.addEventListener('fullscreenchange',() => { const active=!!document.fullscreenElement;$('#fullscreen').setAttribute('aria-label',active?'退出全屏':'全屏显示');$('#fullscreen span').textContent=active?'退出全屏':'全屏'; });

speak.addEventListener('click',async()=>{
 if(busy)return;if(speaking||loading){stopSpeech();prompt('朗读已停止。');return;}
 stopSpeech();const id=voiceId,word=current.word;loading=true;speak.classList.add('speaking');speak.querySelector('span').textContent='加载中 · 停止';speak.setAttribute('aria-pressed','true');
 try{
 let src=window.PHONICS_AUDIO[word];if(!src)src=await loadAudio(word);if(id!==voiceId)return;
 if(player.getAttribute('src')!==src){player.src=src;player.load();}
 const started=player.play();await started;if(id!==voiceId)return;loading=false;speaking=true;speak.querySelector('span').textContent='朗读中 · 停止';prompt('正在朗读 '+word+' · 美式女声');
 }catch(e){if(id!==voiceId)return;stopSpeech();prompt(e.name==='NotAllowedError'?'音频已就绪，请再点一次喇叭。':'音频暂时无法播放，请检查网络后点击喇叭重试。');}
});
player.addEventListener('ended',()=>{stopSpeech();prompt('听清楚了吗？再自己读一遍吧！');});
player.addEventListener('error',()=>{if(speaking||loading){stopSpeech();prompt('音频加载失败，请点击喇叭重试。');}});
paintControls();paintWord(bag.next(state));window.addEventListener('pagehide',stopSpeech);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
})();</script></body>
