<script>
/* Carefully selected regular short-vowel words. No consonant clusters or x. */
(function (root) {
  'use strict';
  const groups = Object.freeze({
    a: Object.freeze('bag bat cab cap cat dad fan gap ham hat jam lap mad map mat nap pad pan pat rag ram ran sad sat tag tap van wag yam zap'.split(' ')),
    e: Object.freeze('bed beg bet den fed get hen jet led leg let men met net peg pen pet red ten vet web wet yes'.split(' ')),
    i: Object.freeze('bib big bin bit did dig dim dip fin fit hid him hip hit kid kit lid lip lit nip pig pin pit rib rid rim rip sit sip tin tip win wig zip'.split(' ')),
    o: Object.freeze('bog cob cod cog cop cot dog dot fog got hop hot jog log lot mop nod not pod pop pot rob rod rot sob top'.split(' ')),
    u: Object.freeze('bud bug bun bus but cub cud cup cut dug fun gum gut hug hum hut jug mud mug nut pup rub rug run sub sum sun tub tug'.split(' '))
  });
  class WordBag {
    constructor(random = Math.random) { this.random = random; this.bags = new Map(); }
    pool(filter) { return filter === 'all' ? Object.values(groups).flat() : [...groups[filter]]; }
    next(filter = 'all', current = '') {
      if (filter !== 'all' && !groups[filter]) filter = 'all';
      let bag = this.bags.get(filter);
      if (!bag || bag.length === 0) {
        bag = this.pool(filter);
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(this.random() * (i + 1));
          [bag[i], bag[j]] = [bag[j], bag[i]];
        }
        this.bags.set(filter, bag);
      }
      // Avoid repeating the visible word, including after switching groups.
      if (bag.length > 1 && bag[bag.length - 1] === current) [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
      return bag.pop();
    }
  }
  root.CVC = { groups, WordBag };
  if (typeof module !== 'undefined') module.exports = root.CVC;
})(typeof globalThis !== 'undefined' ? globalThis : window);

</script>

    sound.setAttribute('aria-label', muted ? '开启滚动音效' : '关闭滚动音效');
    sound.querySelector('use').setAttribute('href', muted ? '#i-mute' : '#i-speaker');
    sound.querySelector('span').textContent = muted ? '音效关' : '音效开';
    lever.setAttribute('aria-disabled', String(busy));
    speak.disabled = busy;
    $('#machine-state').textContent = busy ? '发现新单词' : '准备就绪';
  }
  function initAudio() {
    if (muted) return;
    try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; audio ||= new AC(); if (audio.state === 'suspended') audio.resume().catch(() => {}); } catch {}
  }
  function tone(frequency, duration = .045, volume = .018) {
    if (muted || !audio || audio.state !== 'running') return;
    try { const osc = audio.createOscillator(), gain = audio.createGain(), now = audio.currentTime;
      osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, now); osc.frequency.exponentialRampToValueAtTime(frequency*.75, now+duration);
      gain.gain.setValueAtTime(volume, now); gain.gain.exponentialRampToValueAtTime(.001, now+duration);
      osc.connect(gain); gain.connect(audio.destination); osc.start(now); osc.stop(now+duration);
      osc.onended = () => { osc.disconnect(); gain.disconnect(); };
    } catch {}
  }
  function stopSpeech() {
    speechId++; clearTimeout(speechTimer); speaking = false; speak.classList.remove('speaking'); speak.querySelector('span').textContent = '听一听';
    try { window.speechSynthesis?.cancel(); } catch {}
  }
  function returnLever() { lever.classList.add('returning'); lever.style.setProperty('--pull','0px'); }
  async function spin() {
    if (busy) return;
    busy = true; stopSpeech(); initAudio(); paintControls(); machine.classList.remove('settled'); machine.classList.add('is-spinning');
    prompt('字母转呀转，新单词马上来…');
    lever.classList.add('returning'); lever.style.setProperty('--pull','78px');
    setTimeout(returnLever, 140);
    const target = bag.next(filter,current), previous = current;
    const timer = setInterval(() => tone(280 + Math.random()*180), 115);
    try {
      await Promise.all(reels.map(async (reel,i) => {
        const strip = reel.firstElementChild;
        if (reduced.matches || !strip.animate) {
          await new Promise(resolve => setTimeout(resolve, 180+i*110));
        } else {
          const length = 19 + i*4, nodes = [];
          for (let j=0;j<=length;j++) nodes.push(Object.assign(document.createElement('span'),{textContent:j===0?previous[i]:j===length?target[i]:pools[i][Math.floor(Math.random()*pools[i].length)]}));
          strip.replaceChildren(...nodes);
          const animation = strip.animate([{transform:'translateY(0)'},{transform:`translateY(-${100*length/(length+1)}%)`}],{duration:1450+i*260,easing:'cubic-bezier(.15,.6,.16,1)',fill:'forwards'});
          try { await animation.finished; } catch {} finally { animation.cancel(); }
        }
        strip.replaceChildren(Object.assign(document.createElement('span'),{textContent:target[i]}));
        tone(510+i*140,.08,.035);
      }));
      paintWord(target); machine.classList.add('settled'); prompt('试着把三个音连起来，读一读！');
    } finally { clearInterval(timer); busy=false; machine.classList.remove('is-spinning'); paintControls(); returnLever(); }
  }
  lever.addEventListener('pointerdown', e => {
    if (busy || !e.isPrimary || (e.pointerType==='mouse' && e.button!==0)) return;
    pointer = {id:e.pointerId,x:e.clientX,y:e.clientY,delta:0,moved:0};
    lever.classList.remove('returning'); lever.setPointerCapture(e.pointerId);
  });
  lever.addEventListener('pointermove', e => {
    if (!pointer || pointer.id!==e.pointerId) return;
    pointer.delta = Math.max(0,Math.min(85,e.clientY-pointer.y));
    pointer.moved = Math.max(pointer.moved,Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y));
    lever.style.setProperty('--pull',pointer.delta+'px');
  });
  lever.addEventListener('pointerup', e => {
    if (!pointer || pointer.id!==e.pointerId) return;
    const p = pointer; pointer=null; suppressClickUntil=performance.now()+500; returnLever();
    if (lever.hasPointerCapture(e.pointerId)) lever.releasePointerCapture(e.pointerId);
    if (p.delta>=28 || p.moved<9) spin();
  });
  const cancelDrag = () => { if (pointer) {pointer=null;suppressClickUntil=performance.now()+500;returnLever();} };
  lever.addEventListener('pointercancel',cancelDrag); lever.addEventListener('lostpointercapture',cancelDrag);
  window.addEventListener('blur',cancelDrag);
  lever.addEventListener('click',e => { if (e.detail===0 || performance.now()>suppressClickUntil) spin(); });
  document.addEventListener('keydown', e => {
    if (e.code!=='Space' || e.repeat || e.altKey || e.ctrlKey || e.metaKey || e.target.closest('button,a,input,textarea,select,[contenteditable=true]')) return;
    e.preventDefault(); spin();
  });
  filters.forEach(b => b.addEventListener('click',() => {
    if (busy || b.dataset.filter===filter) return;
    stopSpeech(); filter=b.dataset.filter;save();paintControls();paintWord(bag.next(filter,current));
    prompt(filter==='all'?'五个短元音，一起练一练！':`现在练习短元音 ${filter}，拉动摇杆继续。`);
  }));
  sound.addEventListener('click',() => { muted=!muted;save();paintControls();if(!muted){initAudio();tone(600,.06);} });
  $('#fullscreen').addEventListener('click',async () => {
    try {
      if(document.fullscreenElement) await document.exitFullscreen();
      else if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      else prompt('当前浏览器不支持全屏，可横屏使用。');
    } catch { prompt('暂时无法进入全屏，可用浏览器全屏功能。'); }
  });
  document.addEventListener('fullscreenchange',() => { const active=!!document.fullscreenElement;$('#fullscreen').setAttribute('aria-label',active?'退出全屏':'全屏显示');$('#fullscreen span').textContent=active?'退出全屏':'全屏'; });
  speak.addEventListener('click',() => {
    if (busy) return;
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {prompt('当前浏览器不支持朗读，请换用支持英文语音的浏览器。');return;}
    if(speaking){stopSpeech();return;}
    stopSpeech();const id=speechId;
    const synth=window.speechSynthesis, utterance=new SpeechSynthesisUtterance(current);
    const voices=synth.getVoices();
    utterance.voice=voices.find(v=>/^en[-_]US$/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;
    utterance.lang=utterance.voice?.lang||'en-US';utterance.rate=.78;utterance.pitch=1;utterance.volume=1;
    speaking=true;speak.classList.add('speaking');speak.querySelector('span').textContent='朗读中';
    const done=()=>{if(id!==speechId)return;clearTimeout(speechTimer);speaking=false;speak.classList.remove('speaking');speak.querySelector('span').textContent='听一听';};
    utterance.onend=done;
    utterance.onerror=e=>{if(id!==speechId)return;done();if(!['canceled','interrupted'].includes(e.error))prompt('英文语音暂不可用，请检查设备语音与声音设置。');};
    speechTimer=setTimeout(()=>{if(id===speechId){stopSpeech();prompt('未能完成朗读，请检查设备英文语音与声音设置。');}},10000);
    try{synth.speak(utterance);}catch{done();prompt('朗读暂不可用，请检查设备英文语音设置。');}
  });
  paintControls();paintWord(bag.next(filter));
  window.addEventListener('pagehide',stopSpeech);
})();

</script>
</body>
</html>
