}

 else labels.hidden=false;

  const l=document.createElement('span');l.className=vowel(u)?'vowel-label':'';l.textContent=syllableMode?'第 '+(i+1)+' 音节':silent?'不发音 e':magicVowel?'长元音':(vowel(u)?'元音':'辅音')+(u.length>1?'组合':'');labels.append(l);offset+=u.length;

  function initAudio() {

  }

      gain.gain.setValueAtTime(volume, now); gain.gain.exponentialRampToValueAtTime(.001, now+duration);
      osc.connect(gain); gain.connect(audio.destination); osc.start(now); osc.stop(now+duration);
      osc.onended = () => { osc.disconnect(); gain.disconnect(); };
    } catch {}
  }

const pending=new Map();window.PHONICS_AUDIO ||= {};

function returnLever(){lever.classList.add('returning');lever.style.setProperty('--pull','0px');}

    lever.classList.remove('returning'); lever.setPointerCapture(e.pointerId);
  });

    if (!pointer || pointer.id!==e.pointerId) return;
    pointer.delta = Math.max(0,Math.min(85,e.clientY-pointer.y));

// Reveal is per word. Invalidate pending work when hiding, switching, or spinning.
let pictureOpen=false,pictureId=0;
const pictureCard=$('#picture-card'),pictureAnswer=$('#picture-answer'),pictureImg=$('#picture-img'),pictureMeaning=$('#picture-meaning'),pictureText=$('#picture-text'),pictureToggle=$('#pictures-toggle'),pictureReveal=$('#picture-reveal'),pictureLoads=new Map();
window.PHONICS_PICTURES ||= {};
function pictureControls(label){
 const text=label||(pictureOpen?'收起图片':'看图片');
 for(const button of [pictureToggle,pictureReveal]){button.disabled=busy;button.setAttribute('aria-expanded',String(pictureOpen));button.setAttribute('aria-label',text);button.querySelector('span').textContent=text;}
}
function pictureReset(message='先拼一拼，再看图片和中文词义'){
 pictureId++;pictureOpen=false;pictureAnswer.hidden=true;pictureImg.removeAttribute('src');pictureImg.alt='';pictureMeaning.textContent='';pictureText.textContent=message;pictureText.hidden=false;pictureCard.removeAttribute('data-word');pictureControls();return pictureId;
}
function picturePack(file){if(!pictureLoads.has(file))pictureLoads.set(file,new Promise((resolve,reject)=>{const s=document.createElement('script');let timer;const clean=()=>{clearTimeout(timer);s.remove();};s.src=file;s.onload=()=>{clean();resolve();};s.onerror=()=>{clean();pictureLoads.delete(file);reject(Error('picture load'));};timer=setTimeout(()=>{clean();pictureLoads.delete(file);reject(Error('picture timeout'));},12000);document.head.append(s);}));return pictureLoads.get(file);}
function paintPicture(){pictureReset();}
async function revealPicture(){
 if(busy||!current)return;
 if(pictureOpen){pictureReset();return;}
 const entry=current,id=pictureReset('图片加载中…');pictureOpen=true;pictureControls();
 const meta=window.PICTURE_META[entry.word];
 if(!meta){pictureOpen=false;pictureText.textContent='这个词暂未配图';pictureControls();return;}
 try{
  if(!window.PHONICS_PICTURES[meta.key])await picturePack(meta.pack);
  if(id!==pictureId||!pictureOpen||entry!==current)return;
  const svg=window.PHONICS_PICTURES[meta.key];if(!svg){pictureLoads.delete(meta.pack);throw Error('missing picture');}
  const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),next=new Image();next.src=src;await next.decode();
  if(id!==pictureId||!pictureOpen||entry!==current)return;
  pictureImg.src=src;pictureImg.alt=meta.alt;pictureMeaning.textContent=meta.meaning;
  pictureText.hidden=true;pictureAnswer.hidden=false;pictureCard.dataset.word=entry.word;
 }catch(e){if(id!==pictureId||!pictureOpen||entry!==current)return;pictureOpen=false;pictureText.textContent='图片暂时未能加载，请重试';pictureControls('重试图片');}
}
pictureToggle.addEventListener('click',revealPicture);
pictureReveal.addEventListener('click',revealPicture);

})();</script></body>
